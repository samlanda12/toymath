name: tests

on:
    push:
        branches: [ main ]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout the repo
              uses: actions/checkout@v3

            - name: set up python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: install code
              run: |
                  python -m pip install --upgrade pip
                  pip install ".[test]"

            - name: run tests
              run: |
                  pytest